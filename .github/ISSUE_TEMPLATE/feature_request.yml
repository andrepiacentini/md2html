name: Feature request
description: Suggest a new option or Markdown feature.
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that md2html does not support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would it work? Example commands or Markdown are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
