[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "md2html-cli"
version = "0.1.0"
description = "Render a Markdown file as a faithful, self-contained HTML page and open it in your browser."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Andre Piacentini" }]
keywords = ["markdown", "html", "cli", "preview", "converter", "gfm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]
dependencies = [
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "linkify-it-py>=2.0",
    "pygments>=2.17",
]

[project.urls]
Homepage = "https://github.com/andrepiacentini/md2html"
Documentation = "https://github.com/andrepiacentini/md2html/tree/main/docs"
Issues = "https://github.com/andrepiacentini/md2html/issues"
Changelog = "https://github.com/andrepiacentini/md2html/blob/main/CHANGELOG.md"

[project.scripts]
md2html = "md2html.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pygments>=2.21.0.20260819",
]

[tool.hatch.build.targets.wheel]
packages = ["src/md2html"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["mdit_py_plugins.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["md2html"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
